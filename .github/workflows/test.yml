# Manual only (owner's call, 2026-10-13: Actions minutes are a budget). To run automatically again, replace the on: block with:
#   on:
#     push:
#       branches: [main]
#     pull_request:

name: test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - 01-basic
          - 02-http-nethttp
          - 02b-http-gin
          - 02c-http-chi
          - 02d-http-echo
          - 02e-http-fiber
          - 06-with-otel
          - 07-with-prometheus
          - 08-custom-checker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: cd ${{ matrix.example }} && go build ./...
      - run: cd ${{ matrix.example }} && go vet ./...

  smoke:
    name: smoke (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - 01-basic
          - 06-with-otel
          - 08-custom-checker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: cd ${{ matrix.example }} && go mod download && go build -o /tmp/example .
      - run: |
          set +e
          cd ${{ matrix.example }}
          timeout 5s /tmp/example > out.txt 2>&1
          c=$?
          if [ "$c" -ne 0 ] && [ "$c" -ne 124 ]; then
            cat out.txt; exit 1
          fi
          cat out.txt | head -10
